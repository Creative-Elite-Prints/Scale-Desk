<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Project room</title>
<style>
:root{--bg:#eef1f6;--s:#fff;--ink:#0e1424;--mut:#55607a;--acc:#5b3df5;--on:#fff;--line:#d9deea;--ok:#0a7d4f;--warn:#b7791f}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f1c;--s:#151b2e;--ink:#eaeefb;--mut:#9aa5c4;--acc:#8b78ff;--on:#0b0f1c;--line:#262e48;--ok:#4ade9a;--warn:#f6c453}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.w{max-width:860px;margin:0 auto;padding:20px}
.c{background:var(--s);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
h1{font-size:26px;margin:0 0 4px}h2{font-size:17px;margin:0 0 10px}
.m{color:var(--mut);font-size:14px}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.st{flex:1;min-width:130px;border-top:4px solid var(--line);padding-top:6px;font-size:14px}
.st.on{border-color:var(--ok);color:var(--ok);font-weight:700}
button,.b{font:700 15px inherit;background:var(--acc);color:var(--on);border:0;border-radius:8px;padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-block}
button.alt{background:none;color:var(--ink);border:1.5px solid var(--line)}
button:disabled{opacity:.5;cursor:not-allowed}
input[type=text],textarea{width:100%;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
#msgs{max-height:340px;overflow:auto;margin-bottom:10px}
.msg{padding:8px 0;border-bottom:1px solid var(--line);white-space:pre-wrap;word-wrap:break-word}
.msg b{font-size:13px}.msg span{color:var(--mut);font-size:12px;margin-left:6px}
.f{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tag{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-left:6px}
#err{color:#c0392b;min-height:20px;font-size:14px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div class="w" id="app">
  <div class="c">
    <h1 id="title">Loading…</h1>
    <div class="m" id="who"></div>
    <div class="steps" id="steps"></div>
    <p class="m" id="note"></p>
    <p><b id="money"></b></p>
    <p id="acts"></p>
  </div>
  <div class="c">
    <h2>Messages</h2>
    <div id="msgs" aria-live="polite"></div>
    <textarea id="txt" rows="2" placeholder="Write a message" aria-label="Message"></textarea>
    <p><button id="send" type="button">Send</button></p>
  </div>
  <div class="c">
    <h2>Files</h2>
    <div id="files"></div>
    <p id="up"><input id="pick" type="file" aria-label="Choose a file"> <label id="fl"><input id="fin" type="checkbox"> Final delivery (client gets it after full payment)</label> <button id="upb" type="button" class="alt">Upload</button></p>
    <p class="m">Files up to 7 MB each.</p>
  </div>
  <div id="err" role="alert"></div>
</div>
<script>
(function(){
var T=null;
try{var h=location.hash.match(/t=([\w.-]+)/);if(h){sessionStorage.setItem('rt',h[1]);history.replaceState(null,'',location.pathname)}T=sessionStorage.getItem('rt')}catch(e){}
var $=function(i){return document.getElementById(i)};
if(!T){$('app').innerHTML='<div class="c">Open the private link you were given.</div>';return}
var ID=T.split('.')[0],last=0,room=null,tick=0;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(c,cur){return (c/100).toFixed(2)+' '+cur}
function day(t){return new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}
function api(path,opt){
  opt=opt||{};opt.headers=Object.assign({Authorization:'Bearer '+T},opt.headers||{});
  return fetch('/api/rooms/'+ID+path,opt).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||('Error '+r.status));return d},function(){throw new Error('Error '+r.status)})});
}
function post(path,body){return api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})})}
function fail(e){$('err').textContent=e.message}
function render(){
  var r=room,open=r.status==='open',paid=r.paidCents>=r.amountCents,client=r.role==='client';
  $('title').textContent=r.title;
  $('who').textContent='You are signed in as the '+r.role+'. Client: '+r.clientName;
  $('steps').innerHTML=[['Work in progress',true],['Client approves',r.approved],['Payment complete',paid],['Room closed',!open]].map(function(s){return '<div class="st'+(s[1]?' on':'')+'">'+(s[1]?'✓ ':'')+s[0]+'</div>'}).join('');
  $('note').textContent=open?'Open until '+day(r.expiresAt)+'. The room closes after the client approves the work and the full payment is received.':'Closed ('+r.reason+'). Files can be downloaded until '+day(r.downloadsUntil)+', then they are deleted.';
  $('money').textContent='Paid '+money(r.paidCents,r.currency)+' of '+money(r.amountCents,r.currency);
  $('acts').innerHTML=(r.canApprove?'<button id="appr" type="button">I am happy with the work: approve</button> ':'')+(client&&r.payUrl?'<a class="b" href="'+esc(r.payUrl)+'" target="_blank" rel="noopener noreferrer">Pay now</a>':'');
  $('files').innerHTML=r.files.map(function(f){return '<div class="f"><span>'+esc(f.name)+'<span class="tag">'+(f.final?'Final':'Preview')+'</span> <span class="m">'+Math.ceil(f.size/1024)+' KB · '+esc(f.by)+'</span></span>'+(f.locked?'<span class="m">Unlocks after full payment</span>':'<button class="alt" data-f="'+f.id+'" data-n="'+esc(f.name)+'" type="button">Download</button>')+'</div>'}).join('')||'<p class="m">No files yet.</p>';
  $('send').disabled=$('txt').disabled=!open;$('up').style.display=open?'':'none';$('fl').style.display=client?'none':'';
}
function loadRoom(){return api('').then(function(d){room=d;render()}).catch(fail)}
function loadMsgs(){
  return api('/messages?since='+last).then(function(a){
    if(!a.length)return;var box=$('msgs'),bottom=box.scrollTop+box.clientHeight>=box.scrollHeight-30;
    a.forEach(function(m){last=Math.max(last,m.id);box.insertAdjacentHTML('beforeend','<div class="msg"><b>'+esc(m.name)+'</b><span>'+new Date(m.at).toLocaleString()+'</span><br>'+esc(m.body)+'</div>')});
    if(bottom)box.scrollTop=box.scrollHeight;
  }).catch(fail);
}
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;$('err').textContent='';
  if(b.id==='appr'&&confirm('Approve this work? The room closes once the full payment is also received.'))post('/approve').then(function(d){room=d;render()}).catch(fail);
  if(b.id==='send'){var t=$('txt').value.trim();if(t)post('/messages',{body:t}).then(function(){$('txt').value='';loadMsgs()}).catch(fail)}
  if(b.id==='upb'){
    var f=$('pick').files[0];if(!f){$('err').textContent='Choose a file first';return}
    if(f.size>7*1024*1024){$('err').textContent='File must be under 7 MB';return}
    b.disabled=true;var rd=new FileReader();
    rd.onload=function(){post('/files',{name:f.name,data:String(rd.result).split(',')[1],final:$('fin').checked}).then(function(d){room=d;render();$('pick').value='';$('fin').checked=false}).catch(fail).then(function(){b.disabled=false})};
    rd.readAsDataURL(f);
  }
  if(b.dataset.f){
    fetch('/api/rooms/'+ID+'/files/'+b.dataset.f,{headers:{Authorization:'Bearer '+T}}).then(function(r){if(!r.ok)return r.json().then(function(d){throw new Error(d.error)});return r.blob()}).then(function(bl){var a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=b.dataset.n;a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},2000)}).catch(fail);
  }
});
loadRoom().then(loadMsgs);
setInterval(function(){if(document.hidden)return;loadMsgs();if(++tick%5===0)loadRoom()},3000);
})();
</script>
</body>
</html>
