<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Scale Desk: project rooms</title>
<style>
:root{--bg:#eef1f6;--s:#fff;--ink:#0e1424;--mut:#55607a;--acc:#5b3df5;--on:#fff;--line:#d9deea;--ok:#0a7d4f;--warn:#b7791f}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f1c;--s:#151b2e;--ink:#eaeefb;--mut:#9aa5c4;--acc:#8b78ff;--on:#0b0f1c;--line:#262e48;--ok:#4ade9a;--warn:#f6c453}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.w{max-width:900px;margin:0 auto;padding:20px}
.c{background:var(--s);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
h1{font-size:26px;margin:0 0 12px}h2{font-size:17px;margin:0 0 10px}
.m{color:var(--mut);font-size:14px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.g{grid-template-columns:1fr}}
label{font-size:14px;font-weight:600;display:block;margin:4px 0 2px}
input{width:100%;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{font:700 14px inherit;background:var(--acc);color:var(--on);border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
button.alt{background:none;color:var(--ink);border:1.5px solid var(--line)}
.r{border-top:1px solid var(--line);padding:12px 0}
.r:first-of-type{border-top:0}
.bt{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 9px;margin-left:6px}
.open{color:var(--ok)}.closed{color:var(--warn)}
#err{color:#c0392b;min-height:20px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div class="w">
  <h1>Project rooms</h1>
  <div class="c" id="login">
    <label for="key">Admin key</label>
    <input id="key" type="password" autocomplete="off">
    <p><button id="go" type="button">Sign in</button></p>
  </div>
  <div id="main" hidden>
    <div class="c">
      <h2>New room</h2>
      <div class="g">
        <div><label for="t">Project title</label><input id="t"></div>
        <div><label for="cn">Client name</label><input id="cn"></div>
        <div><label for="am">Total price</label><input id="am" type="number" min="1" step="0.01"></div>
        <div><label for="cur">Currency (3 letters)</label><input id="cur" value="USD" maxlength="3"></div>
        <div><label for="pu">Payment link (optional, https)</label><input id="pu" placeholder="https://..."></div>
        <div><label for="dy">Open for (days)</label><input id="dy" type="number" min="1" value="60"></div>
      </div>
      <p><button id="mk" type="button">Create room</button></p>
      <div id="links"></div>
    </div>
    <div class="c"><h2>Your rooms</h2><div id="list"></div></div>
  </div>
  <div id="err" role="alert"></div>
</div>
<script>
(function(){
var $=function(i){return document.getElementById(i)},K=null;
try{K=sessionStorage.getItem('ak')}catch(e){}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(c,cur){return (c/100).toFixed(2)+' '+cur}
function day(t){return new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}
function api(path,method,body){
  return fetch('/api/rooms'+path,{method:method||'GET',headers:{'x-admin-key':K,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined})
    .then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||('Error '+r.status));return d})});
}
function fail(e){$('err').textContent=e.message}
function linkRow(label,token){
  var url=location.origin+'/r#t='+token;
  return '<p><b>'+label+'</b><br><input readonly value="'+esc(url)+'" onclick="this.select()"></p>';
}
function load(){
  api('').then(function(a){
    $('login').hidden=true;$('main').hidden=false;
    $('list').innerHTML=a.length?a.map(function(r){
      var open=r.status==='open';
      return '<div class="r"><b>'+esc(r.title)+'</b> <span class="pill '+r.status+'">'+r.status+'</span><br><span class="m">'+esc(r.clientName)+' · paid '+money(r.paidCents,r.currency)+' of '+money(r.amountCents,r.currency)+' · client '+(r.approved?'approved':'not approved yet')+' · '+(open?'open until '+day(r.expiresAt):'closed: '+esc(r.reason))+'</span>'+
      '<div class="bt"><button data-a="payment" data-id="'+r.id+'" data-c="'+r.currency+'" type="button">Record payment</button>'+
      (open?'<button class="alt" data-a="extend" data-id="'+r.id+'" type="button">Add 14 days</button><button class="alt" data-a="close" data-id="'+r.id+'" type="button">Close now</button>':'<button class="alt" data-a="extend" data-id="'+r.id+'" type="button">Reopen</button>')+
      '<button class="alt" data-a="relink" data-r="client" data-id="'+r.id+'" type="button">New client link</button><button class="alt" data-a="relink" data-r="developer" data-id="'+r.id+'" type="button">New developer link</button>'+
      '<button class="alt" data-a="purge" data-id="'+r.id+'" type="button">Delete files now</button></div><div id="l'+r.id+'"></div></div>';
    }).join(''):'<p class="m">No rooms yet.</p>';
  }).catch(function(e){$('login').hidden=false;$('main').hidden=true;fail(e)});
}
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;$('err').textContent='';
  if(b.id==='go'){K=$('key').value.trim();try{sessionStorage.setItem('ak',K)}catch(x){}load()}
  if(b.id==='mk'){
    api('','POST',{title:$('t').value,clientName:$('cn').value,amount:+$('am').value,currency:$('cur').value,payUrl:$('pu').value,days:+$('dy').value}).then(function(d){
      $('links').innerHTML='<p class="m">Copy these now. They are shown only once. Anyone with a link can enter the room.</p>'+linkRow('Client link',d.tokens.client)+linkRow('Developer link',d.tokens.developer);
      $('t').value=$('cn').value=$('am').value=$('pu').value='';load();
    }).catch(fail);
  }
  var a=b.dataset.a,id=b.dataset.id;if(!a)return;
  if(a==='payment'){var v=prompt('Amount received ('+b.dataset.c+')');if(v)api('/'+id+'/payment','POST',{amount:+v}).then(load).catch(fail)}
  if(a==='extend')api('/'+id+'/extend','POST',{days:14}).then(load).catch(fail);
  if(a==='close'&&confirm('Close this room now?'))api('/'+id+'/close','POST').then(load).catch(fail);
  if(a==='purge'&&confirm('Delete all files and messages in this room? This cannot be undone.'))api('/'+id+'/purge','POST').then(load).catch(fail);
  if(a==='relink')api('/'+id+'/relink','POST',{role:b.dataset.r}).then(function(d){$('l'+id).innerHTML=linkRow('New '+b.dataset.r+' link (the old one stops working)',d.token)}).catch(fail);
});
if(K)load();
})();
</script>
</body>
</html>
