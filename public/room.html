<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScaleDesk — Project Room & Quotation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; line-height: 1.5; padding: 24px 16px; }
    .container { max-width: 800px; margin: 0 auto; }
    
    .back-link { color: #38bdf8; text-decoration: none; font-size: 0.9rem; font-weight: 600; display: inline-block; margin-bottom: 20px; }
    .back-link:hover { text-decoration: underline; }

    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; margin-bottom: 24px; }
    .job-title { font-size: 1.5rem; font-weight: 700; color: #f8fafc; margin-bottom: 8px; }
    .job-meta { font-size: 0.85rem; color: #94a3b8; margin-bottom: 16px; border-bottom: 1px solid #334155; padding-bottom: 12px; }
    .job-desc { font-size: 0.95rem; color: #cbd5e1; white-space: pre-line; line-height: 1.6; }

    /* Quote Form */
    .form-title { font-size: 1.2rem; font-weight: 700; color: #38bdf8; margin-bottom: 16px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; font-weight: 600; }
    input, textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px 12px; color: #f8fafc; font-size: 0.95rem; }
    input:focus, textarea:focus { border-color: #38bdf8; outline: none; }
    textarea { resize: vertical; height: 120px; }
    
    .submit-btn { background: #0284c7; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; }
    .submit-btn:hover { background: #0369a1; }

    /* Submitted Quotes Stream */
    .quote-item { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 16px; margin-top: 12px; }
    .quote-header { display: flex; justify-content: space-between; font-weight: 700; color: #38bdf8; margin-bottom: 6px; }
    .quote-pitch { font-size: 0.9rem; color: #cbd5e1; }
  </style>
</head>
<body>

  <div class="container">
    <a href="/index.html" class="back-link">← Back to Job Feed</a>

    <!-- Job Requirement Card -->
    <div class="card">
      <h1 class="job-title" id="jobTitle">Loading project...</h1>
      <div class="job-meta" id="jobMeta"></div>
      <h3 style="font-size:1rem; margin-bottom:8px; color:#38bdf8;">Full Client Requirements:</h3>
      <div class="job-desc" id="jobDesc">Fetching complete details...</div>
    </div>

    <!-- Quotation Submission Form -->
    <div class="card">
      <div class="form-title">Submit Your Quotation</div>
      <form id="quoteForm">
        <div class="form-group">
          <label for="quotePrice">Your Proposed Price ($)</label>
          <input type="number" id="quotePrice" placeholder="e.g. 450" required />
        </div>
        <div class="form-group">
          <label for="quoteTime">Estimated Delivery Time</label>
          <input type="text" id="quoteTime" placeholder="e.g. 4 Days" required />
        </div>
        <div class="form-group">
          <label for="quotePitch">Proposal & Pitch Message</label>
          <textarea id="quotePitch" placeholder="Describe your experience, approach, and why you are the best fit..." required></textarea>
        </div>
        <button type="submit" class="submit-btn">Send Proposal to Client</button>
      </form>
    </div>

    <!-- In-App Submitted Quotes List -->
    <div class="card">
      <div class="form-title" style="font-size:1.1rem; color:#f8fafc;">Submitted Quotes for this Project</div>
      <div id="quotesList">
        <p style="font-size:0.85rem; color:#94a3b8;">No quotations submitted yet for this room.</p>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const jobId = urlParams.get('id');

    async function loadJobDetails() {
      if (!jobId) {
        document.getElementById('jobTitle').textContent = 'No Job Selected';
        return;
      }

      try {
        const res = await fetch('/api/jobs');
        const jobs = await res.json();
        const job = jobs.find(j => j.id === jobId);

        if (job) {
          document.getElementById('jobTitle').textContent = job.title;
          document.getElementById('jobMeta').textContent = `Category: ${job.cat || 'General'} | Source: ${job.source}`;
          document.getElementById('jobDesc').textContent = job.fullDesc || job.dir;
        } else {
          document.getElementById('jobTitle').textContent = 'Project Details Loaded';
          document.getElementById('jobDesc').textContent = 'Specific job requirements active. Submit your quotation below.';
        }
      } catch (err) {
        document.getElementById('jobDesc').textContent = 'Unable to fetch full details at this time.';
      }
      
      displayLocalQuotes();
    }

    // Handle Local Quotes Storage
    const quoteForm = document.getElementById('quoteForm');
    quoteForm.addEventListener('submit', function(e) {
      e.preventDefault();
      
      const price = document.getElementById('quotePrice').value;
      const time = document.getElementById('quoteTime').value;
      const pitch = document.getElementById('quotePitch').value;

      const newQuote = { price, time, pitch, date: new Date().toLocaleTimeString() };
      
      let savedQuotes = JSON.parse(localStorage.getItem(`quotes_${jobId}`) || '[]');
      savedQuotes.push(newQuote);
      localStorage.setItem(`quotes_${jobId}`, JSON.stringify(savedQuotes));

      quoteForm.reset();
      displayLocalQuotes();
      alert('Your quotation has been submitted successfully!');
    });

    function displayLocalQuotes() {
      const container = document.getElementById('quotesList');
      const savedQuotes = JSON.parse(localStorage.getItem(`quotes_${jobId}`) || '[]');

      if (savedQuotes.length === 0) {
        container.innerHTML = '<p style="font-size:0.85rem; color:#94a3b8;">No quotations submitted yet for this room.</p>';
        return;
      }

      container.innerHTML = '';
      savedQuotes.forEach(q => {
        const div = document.createElement('div');
        div.className = 'quote-item';
        div.innerHTML = `
          <div class="quote-header">
            <span>Proposed Quote: $${q.price}</span>
            <span>Est. Time: ${q.time}</span>
          </div>
          <div class="quote-pitch">${q.pitch}</div>
          <div style="font-size:0.75rem; color:#64748b; margin-top:6px;">Submitted at ${q.date}</div>
        `;
        container.appendChild(div);
      });
    }

    loadJobDetails();
  </script>
</body>
</html>
