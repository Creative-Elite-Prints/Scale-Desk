<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScaleDesk — Live Job Feed & Freelance Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; line-height: 1.5; padding-bottom: 40px; }
    
    /* Header & Nav Bar */
    header { background: #1e293b; border-bottom: 1px solid #334155; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; sticky; top: 0; z-index: 100; }
    .logo { font-size: 1.25rem; font-weight: 700; color: #38bdf8; letter-spacing: -0.5px; }
    
    .nav-right { display: flex; align-items: center; gap: 16px; }
    
    /* Guides Dropdown */
    .dropdown { position: relative; display: inline-block; }
    .dropbtn { background: #334155; color: #f8fafc; border: none; padding: 8px 14px; font-size: 0.9rem; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .dropbtn:hover { background: #475569; }
    .dropdown-content { display: none; position: absolute; right: 0; background-color: #1e293b; min-width: 220px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.4); border: 1px solid #334155; border-radius: 8px; overflow: hidden; z-index: 10; }
    .dropdown-content a { color: #cbd5e1; padding: 12px 16px; text-decoration: none; display: block; font-size: 0.875rem; border-bottom: 1px solid #334155; }
    .dropdown-content a:hover { background-color: #334155; color: #38bdf8; }
    .dropdown:hover .dropdown-content { display: block; }
    
    .login-btn { background: #0284c7; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 0.9rem; }
    .login-btn:hover { background: #0369a1; }

    /* Feed Container */
    .container { max-width: 900px; margin: 24px auto; padding: 0 16px; }
    .feed-header { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .feed-title { font-size: 1.5rem; font-weight: 700; }
    
    /* Job Cards */
    .job-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; margin-bottom: 16px; transition: transform 0.1s ease, border-color 0.1s ease; }
    .job-card:hover { border-color: #38bdf8; }
    .job-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .job-title { font-size: 1.1rem; font-weight: 600; color: #f8fafc; text-decoration: none; }
    .quote-tag { background: #0369a1; color: #e0f2fe; font-size: 0.75rem; font-weight: 700; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .job-meta { font-size: 0.8rem; color: #94a3b8; margin-bottom: 12px; display: flex; gap: 12px; }
    .job-desc { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 16px; white-space: pre-line; }
    
    .card-actions { display: flex; gap: 10px; }
    .btn-action { background: #334155; color: #f8fafc; border: none; padding: 8px 14px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    .btn-action:hover { background: #475569; }
    .btn-quote { background: #0284c7; color: white; }
    .btn-quote:hover { background: #0369a1; }

    /* Modal Styling */
    .modal { display: none; position: fixed; z-index: 200; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.75); }
    .modal-content { background-color: #1e293b; margin: 10% auto; padding: 24px; border: 1px solid #334155; width: 90%; max-width: 600px; border-radius: 12px; color: #f8fafc; }
    .close-modal { color: #94a3b8; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
    .close-modal:hover { color: #fff; }
  </style>
</head>
<body>

  <header>
    <div class="logo">ScaleDesk</div>
    <div class="nav-right">
      <!-- How-To Dropdown -->
      <div class="dropdown">
        <button class="dropbtn">Guides & How-To ▼</button>
        <div class="dropdown-content">
          <a href="#" onclick="showGuide('proposals')">How to Write Winning Quotes</a>
          <a href="#" onclick="showGuide('pricing')">Setting Your Freelance Rates</a>
          <a href="#" onclick="showGuide('closing')">Closing High-Value Clients</a>
        </div>
      </div>
      <a href="/admin.html" class="login-btn">Sign In / Dashboard</a>
    </div>
  </header>

  <div class="container">
    <div class="feed-header">
      <div class="feed-title">Live Client Requirements</div>
      <div id="job-count" style="font-size:0.875rem; color:#94a3b8;">Loading feed...</div>
    </div>

    <div id="feed"></div>
  </div>

  <!-- Guide Modal -->
  <div id="guideModal" class="modal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal()">&times;</span>
      <h2 id="guideTitle" style="margin-bottom: 12px; color:#38bdf8;"></h2>
      <p id="guideBody" style="font-size:0.95rem; color:#cbd5e1; line-height:1.6;"></p>
    </div>
  </div>

  <script>
    async function loadJobs() {
      try {
        const res = await fetch('/api/jobs');
        const jobs = await res.json();
        document.getElementById('job-count').textContent = `${jobs.length} Active Jobs`;
        
        const feed = document.getElementById('feed');
        feed.innerHTML = '';

        jobs.forEach(j => {
          const card = document.createElement('div');
          card.className = 'job-card';
          card.innerHTML = `
            <div class="job-top">
              <span class="job-title">${j.title}</span>
              <span class="quote-tag">Quotation Required</span>
            </div>
            <div class="job-meta">
              <span>Category: ${j.cat || 'General'}</span>
              <span>Source: ${j.source}</span>
            </div>
            <div class="job-desc">${j.dir}...</div>
            <div class="card-actions">
              <button class="btn-action btn-quote" onclick="openRoom('${j.id}')">Submit Quotation</button>
            </div>
          `;
          feed.appendChild(card);
        });
      } catch (err) {
        document.getElementById('job-count').textContent = 'Error loading live jobs.';
      }
    }

    function openRoom(jobId) {
      window.location.href = `/room.html?id=${encodeURIComponent(jobId)}`;
    }

    const guides = {
      proposals: "Winning quotes focus on client solutions rather than just listing your skills. Keep your message under 3 paragraphs, ask 1 clarifying question about their specifications, and outline an exact delivery timeline.",
      pricing: "Never compete on price alone. Base your quotations on total project scope, factoring in revision rounds, complexity, and specialized software needs.",
      closing: "Offer clients an immediate 10-minute discovery message or consultation to outline project milestones before payment terms are locked."
    };

    function showGuide(type) {
      document.getElementById('guideTitle').textContent = type === 'proposals' ? 'How to Write Winning Quotes' : (type === 'pricing' ? 'Setting Your Freelance Rates' : 'Closing High-Value Clients');
      document.getElementById('guideBody').textContent = guides[type];
      document.getElementById('guideModal').style.display = 'block';
    }

    function closeModal() {
      document.getElementById('guideModal').style.display = 'none';
    }

    loadJobs();
  </script>
</body>
</html>
